name: Build Node 24 with pnpm

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/node/24.20.0/**"
      - ".github/workflows/build-node-24-pnpm.yml"

permissions:
  contents: read

concurrency:
  group: build-node-24-pnpm-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: registry.cn-chengdu.aliyuncs.com/yoyosoft/node:24.20.0

jobs:
  build-and-publish:
    name: Build and publish linux/amd64 + linux/arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Chengdu
        uses: docker/login-action@v4
        with:
          registry: registry.cn-chengdu.aliyuncs.com
          username: ${{ vars.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: src/node/24.20.0
          file: src/node/24.20.0/Dockerfile.linux-arm64.linux-amd64
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ env.IMAGE }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifest and runtime
        shell: bash
        run: |
          docker buildx imagetools inspect "${IMAGE}"
          docker run --rm --platform linux/amd64 "${IMAGE}" sh -lc '
            test "$(node --version)" = "v24.20.0"
            test "$(pnpm --version)" = "10.6.2"
          '

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Published image"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Node.js: \`24.20.0\`"
            echo "- pnpm: \`10.6.2\`"
          } >> "${GITHUB_STEP_SUMMARY}"
